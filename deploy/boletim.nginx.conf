# /etc/nginx/sites-available/boletim  (ative com: ln -s ... /etc/nginx/sites-enabled/boletim)
# Troque boletim.senar-rs.com.br e os caminhos do certificado pelos reais.
#
# SE O APACHE JÁ USA AS PORTAS 80/443 neste servidor, há duas saídas:
#   a) rodar este nginx em outra porta (ex.: listen 8443 ssl;) e liberar essa porta só para a rede interna; ou
#   b) não usar nginx e fazer o Apache servir de proxy reverso (veja o trecho "ProxyPass" no INSTALL.md).
# Em ambos os casos o Node continua escutando só em 127.0.0.1:3000.

server {
    listen 80;
    listen [::]:80;
    server_name boletim.senar-rs.com.br;
    return 301 https://$host$request_uri;
}

server {
    # "ssl http2" funciona no nginx 1.18 (Ubuntu 22.04) e 1.24 (24.04); a diretiva "http2 on;" só existe a partir do 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boletim.senar-rs.com.br;

    ssl_certificate     /etc/ssl/boletim/fullchain.pem;
    ssl_certificate_key /etc/ssl/boletim/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Logo de até 2 MB (+ margem).
    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    # Opcional, só depois de confirmar que o HTTPS está estável:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for ACRESCENTA o IP do cliente real à cadeia. O app usa
        # trust proxy = 1 e o limitador de tentativas de login depende de req.ip.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exportação (Chromium) pode levar dezenas de segundos.
        proxy_read_timeout 90s;
    }
}
