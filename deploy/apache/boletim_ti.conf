# =============================================================================
# Comunicado Semanal SENAR-RS publicado em  http://192.168.10.161/boletim_ti/
# Snippet para Include dentro do <VirtualHost *:80> (e, na fase HTTPS, do *:443).
# Guia completo, ordem de aplicacao e reversao: deploy/apache/README.md
#
# Escopo: SOMENTE o caminho /boletim_ti. Nenhuma diretiva abaixo afeta outros caminhos
# ou outros sistemas do servidor. Por isso nao ha RewriteRule aqui (a regra global
# HTTP->HTTPS do vhost recebe uma excecao, descrita no README) e nao ha ProxyTimeout
# (e global ao vhost; o timeout vai como parametro do ProxyPass).
#
# ORDEM IMPORTA: o ProxyPass vale na ordem em que aparece no vhost (o primeiro que casa
# vence). Inclua este arquivo ANTES de qualquer "ProxyPass /" ou ProxyPassMatch mais amplo.
# Confira com:  grep -RIn "ProxyPass" /etc/apache2/
# =============================================================================

# 1) /boletim_ti (sem barra) -> /boletim_ti/ (301). Usa mod_alias em vez de RewriteRule para nao
#    interferir na regra global de mod_rewrite. Casa so o caminho exato /boletim_ti.
RedirectMatch permanent ^/boletim_ti$ /boletim_ti/

# 2) Proxy para o contêiner (127.0.0.1:3100), MANTENDO o prefixo (o app foi iniciado com
#    BASE_PATH=/boletim_ti e espera receber o prefixo). timeout=90 (segundos) cobre a
#    exportacao de PDF/PNG pelo Chromium.
ProxyPass /boletim_ti/ http://127.0.0.1:3100/boletim_ti/ timeout=90
ProxyPassReverse /boletim_ti/ http://127.0.0.1:3100/boletim_ti/

<Location /boletim_ti/>
    # Preserva o Host original (192.168.10.161) para o app. Dentro do Location para nao
    # alterar o comportamento de outros proxies do mesmo vhost.
    ProxyPreserveHost On

    # >>> PREENCHA ANTES DE APLICAR <<<
    # O texto abaixo e um PLACEHOLDER PROPOSITAL e NAO e um valor valido: o
    # "apachectl configtest" FALHA enquanto ele existir, impedindo publicar o app
    # aberto a qualquer origem por esquecimento. Troque pela(s) rede(s) autorizada(s).
    # O firewall local esta inativo; esta linha e o unico controle de rede.
    # Exemplos:
    #   Require ip 192.168.10.0/24
    #   Require ip 192.168.10.0/24 192.168.20.0/24
    #   Require ip 192.168.10.50 192.168.10.51
    Require ip FAIXA_AUTORIZADA_AQUI

    # X-Forwarded-Proto: so e necessario na fase HTTPS (Express com "trust proxy" + COOKIE_SECURE=true).
    # Condicional ao modulo (pre-requisito da fase HTTPS: a2enmod headers) para nao quebrar o
    # configtest enquanto mod_headers nao estiver ativo. O "unset" impede que um cliente
    # forje o cabecalho em HTTP puro; o "set" so ocorre em conexoes SSL (env=HTTPS).
    <IfModule mod_headers.c>
        RequestHeader unset X-Forwarded-Proto
        RequestHeader set X-Forwarded-Proto "https" env=HTTPS
    </IfModule>
</Location>
